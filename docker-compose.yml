name: event-driven-shop

services:
  postgres:
    image: postgres:16-alpine
    container_name: edd-postgres
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    container_name: edd-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: edd-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Application services. They run on your host with `make dev` by default.
  # Run them in Docker with: docker compose --profile apps up -d --build
  # ---------------------------------------------------------------------------

  kafka-init:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "broker/create_topics.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  orders:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ["sh", "-c", "cd services/orders && uvicorn app.main:app --host 0.0.0.0 --port 8001"]
    environment:
      ORDERS_DATABASE_URL: postgresql://shop:shop@postgres:5432/orders_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  stock:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ["sh", "-c", "cd services/stock && uvicorn app.main:app --host 0.0.0.0 --port 8002"]
    environment:
      STOCK_DATABASE_URL: postgresql://shop:shop@postgres:5432/stock_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  invoices:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ["sh", "-c", "cd services/invoices && uvicorn app.main:app --host 0.0.0.0 --port 8003"]
    environment:
      INVOICES_DATABASE_URL: postgresql://shop:shop@postgres:5432/invoices_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  fiscal:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ["sh", "-c", "cd services/fiscal && uvicorn app.main:app --host 0.0.0.0 --port 8004"]
    environment:
      FISCAL_DATABASE_URL: postgresql://shop:shop@postgres:5432/fiscal_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  recommendations:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "sh",
        "-c",
        "cd services/recommendations && uvicorn app.main:app --host 0.0.0.0 --port 8005",
      ]
    environment:
      RECOMMENDATIONS_DATABASE_URL: postgresql://shop:shop@postgres:5432/recommendations_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
