[project]
name = "event-driven-shop"
version = "0.1.0"
description = "A small event-driven e-commerce system for studying Kafka, FastAPI and Postgres."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared/edd_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI uses function calls (Depends/Query/...) in argument defaults by design.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = [
    "edd_common",
    "app",
    "orders",
    "stock",
    "invoices",
    "fiscal",
    "recommendations",
    "broker",
]
